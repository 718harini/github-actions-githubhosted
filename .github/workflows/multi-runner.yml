name: Multi-Runner CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Build Machine
        run: |
          echo "BUILD JOB"
          hostname
          uname -a

  test:
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Test Machine
        run: |
          echo "TEST JOB"
          hostname
          uname -a

  deploy:
    needs: test
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Deploy Machine
        run: |
          echo "DEPLOY JOB"
          hostname
          uname -a
